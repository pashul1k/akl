<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="threads-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fda4c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="th-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#threads-grad)"/>

  <!-- Glowing circles -->
  <circle cx="180" cy="450" r="90" fill="url(#th-glow)" opacity="0.4"/>
  <circle cx="620" cy="150" r="110" fill="url(#th-glow)" opacity="0.3"/>

  <!-- @ symbol (Threads style) -->
  <circle cx="400" cy="280" r="100" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>
  <path d="M 450 280 Q 450 230 400 230 Q 350 230 350 280 Q 350 330 400 330 Q 440 330 450 300" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>
  <line x1="450" y1="240" x2="450" y2="340" stroke="white" stroke-width="12" opacity="0.9"/>

  <!-- Decorative hearts -->
  <path d="M 150 200 L 165 185 Q 172 178 180 185 Q 188 178 195 185 L 180 210 Q 172 218 165 210 Z" fill="white" opacity="0.6"/>
  <path d="M 630 400 L 645 385 Q 652 378 660 385 Q 668 378 675 385 L 660 410 Q 652 418 645 410 Z" fill="white" opacity="0.7"/>

  <!-- Sparkles -->
  <circle cx="250" cy="150" r="5" fill="white" opacity="0.8"/>
  <circle cx="550" cy="450" r="6" fill="white"/>
  <circle cx="300" cy="420" r="4" fill="white" opacity="0.9"/>

  <!-- Text -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">Threads</text>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.9">Сообщество единомышленников</text>
</svg>
