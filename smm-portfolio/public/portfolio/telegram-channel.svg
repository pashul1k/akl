<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d8b4fe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="tg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#d8b4fe;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#tg-grad)"/>

  <!-- Glowing elements -->
  <circle cx="150" cy="100" r="80" fill="url(#tg-glow)" opacity="0.5"/>
  <circle cx="650" cy="500" r="100" fill="url(#tg-glow)" opacity="0.4"/>

  <!-- Paper plane (Telegram icon) -->
  <path d="M 350 250 L 500 200 L 400 380 L 350 330 Z" fill="white" opacity="0.9"/>
  <path d="M 400 380 L 420 420 L 450 350 Z" fill="white" opacity="0.7"/>
  <circle cx="400" cy="300" r="140" fill="none" stroke="white" stroke-width="6" opacity="0.4"/>

  <!-- Sparkles -->
  <circle cx="250" cy="350" r="6" fill="white"/>
  <circle cx="280" cy="320" r="4" fill="white" opacity="0.8"/>
  <circle cx="550" cy="280" r="5" fill="white" opacity="0.9"/>
  <circle cx="580" cy="320" r="7" fill="white"/>

  <!-- Text -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">Telegram</text>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.9">Контент с душой</text>
</svg>
