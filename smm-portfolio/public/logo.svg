<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb6fa1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wing-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#fb6fa1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Бабочка - символ трансформации -->
  <!-- Левое верхнее крыло -->
  <path d="M 60 60 Q 35 35 30 20 Q 28 10 35 8 Q 45 10 50 25 Q 55 40 60 60 Z"
        fill="url(#wing-gradient)"
        stroke="#e11d68"
        stroke-width="1.5"
        filter="url(#shadow)"/>

  <!-- Левое нижнее крыло -->
  <path d="M 60 60 Q 35 75 25 85 Q 20 95 28 98 Q 38 96 48 82 Q 56 70 60 60 Z"
        fill="url(#wing-gradient)"
        stroke="#e11d68"
        stroke-width="1.5"
        filter="url(#shadow)"/>

  <!-- Правое верхнее крыло -->
  <path d="M 60 60 Q 85 35 90 20 Q 92 10 85 8 Q 75 10 70 25 Q 65 40 60 60 Z"
        fill="url(#wing-gradient)"
        stroke="#e11d68"
        stroke-width="1.5"
        filter="url(#shadow)"/>

  <!-- Правое нижнее крыло -->
  <path d="M 60 60 Q 85 75 95 85 Q 100 95 92 98 Q 82 96 72 82 Q 64 70 60 60 Z"
        fill="url(#wing-gradient)"
        stroke="#e11d68"
        stroke-width="1.5"
        filter="url(#shadow)"/>

  <!-- Тело бабочки - сердце в центре -->
  <ellipse cx="60" cy="60" rx="8" ry="30"
           fill="url(#logo-gradient)"
           stroke="#be185d"
           stroke-width="2"
           filter="url(#shadow)"/>

  <!-- Голова -->
  <circle cx="60" cy="40" r="6"
          fill="url(#logo-gradient)"
          stroke="#be185d"
          stroke-width="1.5"/>

  <!-- Усики -->
  <path d="M 57 35 Q 53 28 50 22"
        stroke="#be185d"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"/>
  <path d="M 63 35 Q 67 28 70 22"
        stroke="#be185d"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"/>

  <!-- Точки на усиках -->
  <circle cx="50" cy="22" r="2.5" fill="#ec4899"/>
  <circle cx="70" cy="22" r="2.5" fill="#a855f7"/>

  <!-- Декоративные элементы на крыльях -->
  <circle cx="40" cy="35" r="4" fill="#fda4c7" opacity="0.8"/>
  <circle cx="80" cy="35" r="4" fill="#d8b4fe" opacity="0.8"/>
  <circle cx="38" cy="75" r="3.5" fill="#fb923c" opacity="0.8"/>
  <circle cx="82" cy="75" r="3.5" fill="#fda4c7" opacity="0.8"/>

  <!-- Маленькие акценты -->
  <circle cx="48" cy="50" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="72" cy="50" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
