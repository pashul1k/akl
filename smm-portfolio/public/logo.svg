<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Огненные градиенты -->
    <linearGradient id="phoenix-flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ff8787;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffa94d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd43b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="phoenix-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fa5252;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e03131;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="phoenix-wings" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff8787;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa94d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>

    <!-- Свечение -->
    <filter id="glow-phoenix">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="flame-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd43b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Огненное свечение вокруг -->
  <circle cx="60" cy="60" r="50" fill="url(#flame-glow)" opacity="0.4"/>

  <!-- Левое крыло -->
  <path d="M 60 50 Q 30 40 20 35 Q 10 30 15 25 Q 20 22 30 28 Q 40 35 50 42 Q 55 45 60 50 Z"
        fill="url(#phoenix-wings)"
        stroke="#fa5252"
        stroke-width="1.5"
        filter="url(#glow-phoenix)"/>

  <!-- Верхние перья левого крыла -->
  <path d="M 40 35 Q 25 30 18 28 Q 15 27 16 24 Q 18 22 23 25 Q 30 28 40 35 Z"
        fill="url(#phoenix-flame)"
        opacity="0.9"/>

  <!-- Нижние перья левого крыла -->
  <path d="M 50 45 Q 35 50 25 52 Q 20 53 21 48 Q 22 45 28 44 Q 38 43 50 45 Z"
        fill="url(#phoenix-flame)"
        opacity="0.9"/>

  <!-- Правое крыло -->
  <path d="M 60 50 Q 90 40 100 35 Q 110 30 105 25 Q 100 22 90 28 Q 80 35 70 42 Q 65 45 60 50 Z"
        fill="url(#phoenix-wings)"
        stroke="#fa5252"
        stroke-width="1.5"
        filter="url(#glow-phoenix)"/>

  <!-- Верхние перья правого крыла -->
  <path d="M 80 35 Q 95 30 102 28 Q 105 27 104 24 Q 102 22 97 25 Q 90 28 80 35 Z"
        fill="url(#phoenix-flame)"
        opacity="0.9"/>

  <!-- Нижние перья правого крыла -->
  <path d="M 70 45 Q 85 50 95 52 Q 100 53 99 48 Q 98 45 92 44 Q 82 43 70 45 Z"
        fill="url(#phoenix-flame)"
        opacity="0.9"/>

  <!-- Тело птицы -->
  <ellipse cx="60" cy="60" rx="12" ry="18"
           fill="url(#phoenix-body)"
           stroke="#c92a2a"
           stroke-width="2"
           filter="url(#glow-phoenix)"/>

  <!-- Голова -->
  <circle cx="60" cy="43" r="8"
          fill="url(#phoenix-body)"
          stroke="#c92a2a"
          stroke-width="1.5"
          filter="url(#glow-phoenix)"/>

  <!-- Клюв -->
  <path d="M 68 43 L 73 43 L 68 45 Z"
        fill="#ffd43b"
        stroke="#ff8787"
        stroke-width="1"/>

  <!-- Глаз -->
  <circle cx="63" cy="42" r="2" fill="#fff"/>
  <circle cx="63.5" cy="42" r="1" fill="#212529"/>

  <!-- Хохолок -->
  <path d="M 58 35 Q 57 30 55 28"
        stroke="url(#phoenix-flame)"
        stroke-width="2"
        stroke-linecap="round"
        fill="none"/>
  <path d="M 60 33 Q 60 27 60 25"
        stroke="url(#phoenix-flame)"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"/>
  <path d="M 62 35 Q 63 30 65 28"
        stroke="url(#phoenix-flame)"
        stroke-width="2"
        stroke-linecap="round"
        fill="none"/>

  <!-- Огненные точки на хохолке -->
  <circle cx="55" cy="28" r="2.5" fill="#ffd43b"/>
  <circle cx="60" cy="25" r="3" fill="#ffa94d"/>
  <circle cx="65" cy="28" r="2.5" fill="#ffd43b"/>

  <!-- Хвост - огненные перья -->
  <path d="M 60 78 Q 50 90 45 95 Q 42 98 44 100 Q 47 98 52 92 Q 58 85 60 78 Z"
        fill="url(#phoenix-flame)"
        stroke="#ff8787"
        stroke-width="1"
        opacity="0.95"/>

  <path d="M 60 78 Q 58 92 58 100 Q 58 105 60 105 Q 62 105 62 100 Q 62 92 60 78 Z"
        fill="url(#phoenix-flame)"
        stroke="#ffa94d"
        stroke-width="1"
        opacity="0.95"/>

  <path d="M 60 78 Q 70 90 75 95 Q 78 98 76 100 Q 73 98 68 92 Q 62 85 60 78 Z"
        fill="url(#phoenix-flame)"
        stroke="#ff8787"
        stroke-width="1"
        opacity="0.95"/>

  <!-- Огненные искры вокруг -->
  <circle cx="30" cy="35" r="2.5" fill="#ffd43b" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="35" r="2.5" fill="#ffa94d" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="55" r="2" fill="#ff8787" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="55" r="2" fill="#ff6b6b" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Маленькие языки пламени внизу -->
  <path d="M 50 95 Q 48 100 50 103"
        stroke="#ffd43b"
        stroke-width="2"
        stroke-linecap="round"
        fill="none"
        opacity="0.8"/>
  <path d="M 60 100 Q 58 105 60 108"
        stroke="#ffa94d"
        stroke-width="2"
        stroke-linecap="round"
        fill="none"
        opacity="0.8"/>
  <path d="M 70 95 Q 72 100 70 103"
        stroke="#ffd43b"
        stroke-width="2"
        stroke-linecap="round"
        fill="none"
        opacity="0.8"/>
</svg>
